apiVersion: apps/v1
kind: Deployment
metadata:
  name: rssie-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rssie-backend
  template:
    metadata:
      labels:
        app: rssie-backend
    spec:
      containers:
      - name: backend
        image: rssie-backend:latest 
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: ELASIC_CLOUD_ID
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: ELASTIC_CLOUD_ID
        - name: ELASTIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: ELASTIC_API_KEY
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: elastic-credentials
              key: OTEL_EXPORTER_OTLP_HEADERS
        - name: OTEL_SERVICE_NAME
          value: "rssie-backend-k8s"
---
apiVersion: v1
kind: Service
metadata:
  name: rssie-backend-service
spec:
  selector:
    app: rssie-backend
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: LoadBalancer
